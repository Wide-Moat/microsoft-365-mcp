# Every check this repository has, self-contained: nothing here calls a workflow in another repository.
# Hosted runners only: a public repository must never run outside contributions on our own machines.
name: validate

on:
  workflow_dispatch:
  # publish.yml runs every check here on the release tag before anything is published.
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: install the locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.lock
          python -m pip install --no-deps -e .
      - name: format and lint
        run: |
          python -m ruff format --check src tests scripts
          python -m ruff check src tests scripts
      - name: the tests pass
        run: python -m pytest -q -p no:cacheprovider --junitxml=report.xml
      - name: the suite is not empty and every collected test ran
        # A collection error or a skipped module leaves a suite that runs nothing and passes.
        # The floor is derived from the tests on disk, not a number chosen once.
        run: |
          defined=$(grep -rhoE '^\s*(async )?def test_[a-z0-9_]+' tests | wc -l | tr -d ' ')
          ran=$(python scripts/junit_ran.py report.xml)
          echo "$defined test functions on disk, $ran test cases ran"
          if [ "$defined" -lt 300 ]; then
            echo "fewer test functions than this repository has: the check itself is broken"; exit 2
          fi
          if [ "$ran" -lt "$defined" ]; then
            echo "$((defined - ran)) test functions did not run"; exit 1
          fi
      - name: the catalogue fits the token budget
        shell: bash
        run: |
          set -euo pipefail
          python -m m365_mcp.budget --check | tee budget.md
          echo "## Token budget (default areas)" >> "$GITHUB_STEP_SUMMARY"
          cat budget.md >> "$GITHUB_STEP_SUMMARY"
          python -m m365_mcp.budget --all --check-tools > /dev/null
      - name: every safety rule is caught by a test when it is broken
        run: python scripts/mutation_check.py
      - name: the tool surface matches tool-surface.lock.json
        run: python -m m365_mcp.surface --check
      - name: every Must refuse row names a collected test
        shell: bash
        run: |
          set -euo pipefail
          # tee, not a redirect: on failure the offending rows stay in the step log.
          python scripts/refusal_map.py | tee refusal-map.txt | grep -vE '^(docs/|    test_)'
          grep -E '^[0-9]+ rows in' refusal-map.txt >> "$GITHUB_STEP_SUMMARY"
      - name: every Must refuse row's test fails with its guard removed
        # All rows, about 70 s: each mutation runs one test file's single test.
        shell: bash
        run: |
          set -euo pipefail
          python scripts/refusal_evidence.py | tee refusal-evidence.txt
          grep -E '^[0-9]+/[0-9]+ row tests' refusal-evidence.txt >> "$GITHUB_STEP_SUMMARY"
      - name: every manifesto rule names a collected test
        shell: bash
        run: |
          set -euo pipefail
          python scripts/manifesto_map.py | tee manifesto-map.txt
          grep -E '^[0-9]+ rules, ' manifesto-map.txt >> "$GITHUB_STEP_SUMMARY"
      - name: docs/tools.md matches the registry
        run: |
          python -m m365_mcp.docs > /tmp/tools.md
          diff -u docs/tools.md /tmp/tools.md

  budget-comment:
    # The table on the pull request, so the cost of a change is read before it merges.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --require-hashes -r requirements-test.lock
          python -m pip install --no-deps -e .
          python -m m365_mcp.budget > budget.md
      - name: post or update the comment
        # curl and the REST API: a self-hosted runner need not have the gh CLI.
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json")
          { echo "<!-- m365-budget -->"; echo "### Token budget"; echo; cat budget.md; } > body.md
          payload=$(python -c 'import json,sys; print(json.dumps({"body": open("body.md").read()}))')
          id=$(curl -fsS "${auth[@]}" "${api}/issues/${PR}/comments?per_page=100" \
               | python scripts/comment_id.py)
          if [ -n "$id" ]; then
            curl -fsS -X PATCH "${auth[@]}" "${api}/issues/comments/${id}" -d "$payload" > /dev/null
          else
            curl -fsS -X POST "${auth[@]}" "${api}/issues/${PR}/comments" -d "$payload" > /dev/null
          fi
          echo "budget comment posted on #${PR}"

  # No real organisation's data in tracked files: addresses, tenant names, public IPs (manifesto 41).
  purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/purity_check.py .

  # No secret in the tree or the history. The binary is pinned by version and checksum, so a
  # moved tag cannot change what runs here.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks over every commit
        shell: bash
        run: |
          set -euo pipefail
          v=8.21.2
          base=https://github.com/gitleaks/gitleaks/releases/download
          curl -fsSL -o gl.tgz "$base/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx run yamllint==1.35.1 --strict .

  # The state store contract against real Redis, Valkey and both behind Sentinel (scripts/state-contract.sh
  # starts them in Docker), then every mutation of the store scripts, which only real servers can catch.
  state:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the contract on every real store
        run: scripts/state-contract.sh -m pytest -q -p no:cacheprovider -rs tests/state
      - name: every store script's guard is caught when it is broken
        run: scripts/state-contract.sh scripts/mutation_check.py --stores

  # The chart renders, refuses what it must, and in a kind cluster runs three replicas on Valkey behind
  # Sentinel: shared allowance and links, failover, the key delivered by the init container, JSON logs,
  # metrics on their own port, the autoscaler (scripts/chart-e2e.sh counts its own checks). GitHub-hosted
  # runners only.
  chart:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: chart, image and package carry one version
        run: |
          set -euo pipefail
          py=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          init=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/m365_mcp/__init__.py)
          chart=$(sed -n 's/^version: //p' charts/microsoft-365-mcp/Chart.yaml)
          app=$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' charts/microsoft-365-mcp/Chart.yaml)
          echo "pyproject ${py}, package ${init}, chart ${chart}, appVersion ${app}"
          test -n "$py" && test "$py" = "$init" && test "$py" = "$chart" && test "$py" = "$app"
          awk -v h="## ${py}:" 'index($0, h) == 1 {found=1} END {exit !found}' CHANGELOG.md
      - name: tools
        run: |
          set -euo pipefail
          helm version --short && kind version && kubectl version --client=true | head -1
          curl -fsSL --retry 3 -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
      - name: renders valid manifests, and refuses what it must
        run: |
          set -euo pipefail
          c=charts/microsoft-365-mcp
          ok=(--set key.existingSecret=m365-key --set linksBaseUrl=https://files.example.com
              --set "state.sentinel.hosts={store-sentinel:26379}" --set state.existingSecret=m365-state)
          helm lint --strict "$c" "${ok[@]}"
          helm template t "$c" "${ok[@]}" > rendered.yaml
          /tmp/kubeconform -strict -summary rendered.yaml
          grep -q 'name: stage-keys' rendered.yaml
          # everything optional renders and is valid: autoscaler, ServiceMonitor (its CRD is skipped), Ingress
          helm template t "$c" "${ok[@]}" --set autoscaling.enabled=true --set autoscaling.inFlightPerPod=20 \
            --set metrics.serviceMonitor.enabled=true --set ingress.enabled=true --set ingress.className=nginx \
            --set ingress.tlsSecretName=files-tls --set caBundle.configMap=corp-ca > all.yaml
          /tmp/kubeconform -strict -summary -skip ServiceMonitor all.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("all.yaml")) if d]
          kinds = sorted(d["kind"] for d in docs)
          print("rendered:", kinds)
          for kind in ("Deployment", "Service", "PodDisruptionBudget", "HorizontalPodAutoscaler", "ServiceMonitor",
                       "Ingress"):
              assert kind in kinds, f"no {kind}"
          ingress = next(d for d in docs if d["kind"] == "Ingress")
          routes = sorted((p["path"], p["backend"]["service"]["port"]["name"])
                          for rule in ingress["spec"]["rules"] for p in rule["http"]["paths"])
          assert routes == [("/d/", "links"), ("/u/", "links")], routes  # the links routes and nothing else
          PY
          refuses() {
            want="$1"; shift
            if out=$(helm template t "$c" "$@" 2>&1); then echo "rendered: $*"; exit 1; fi
            grep -qF "$want" <<<"$out" || { echo "refused for another reason: $out"; exit 1; }
            echo "refused as expected: $want"
          }
          refuses "key.existingSecret is required" --set linksBaseUrl=https://files.example.com --set replicaCount=1
          refuses "more than one replica" --set key.existingSecret=k --set linksBaseUrl=https://files.example.com
          refuses "more than one replica" --set key.existingSecret=k --set linksBaseUrl=https://files.example.com \
            --set replicaCount=1 --set autoscaling.enabled=true
          refuses "linksBaseUrl is required" --set key.existingSecret=k --set replicaCount=1
          refuses "linksBaseUrl is required" --set key.existingSecret=k --set replicaCount=1 \
            --set linksBaseUrl=http://files.example.com
          refuses "two different stores" "${ok[@]}" --set state.url=redis://store:6379/0
          refuses "carries credentials" --set key.existingSecret=k --set linksBaseUrl=https://files.example.com \
            --set state.url=redis://:secret@store:6379/0
          refuses "no CPU limit" "${ok[@]}" --set resources.limits.cpu=1
          refuses "metrics.port must differ" "${ok[@]}" --set metrics.port=8001
      - name: build the image for the cluster
        run: docker build -t microsoft-365-mcp:e2e .
      - name: the image reports the chart's version
        run: |
          set -euo pipefail
          got=$(docker run --rm --entrypoint python microsoft-365-mcp:e2e \
            -c 'import m365_mcp; print(m365_mcp.__version__)')
          want=$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' charts/microsoft-365-mcp/Chart.yaml)
          echo "image ${got}, chart appVersion ${want}"
          test -n "$want" && test "$got" = "$want"
      - name: a cluster, with metrics-server for the autoscaler
        run: |
          set -euo pipefail
          kind create cluster --name e2e --wait 120s
          kind load docker-image microsoft-365-mcp:e2e --name e2e
          curl -fsSL --retry 3 -o /tmp/metrics-server.yaml \
            https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.8.0/components.yaml
          echo "ff64d1a13b9ac3b0635f0dd985815fb44c23eed4706c04e5db1daadf6bc0a83b  /tmp/metrics-server.yaml" \
            | sha256sum -c -
          kubectl apply -f /tmp/metrics-server.yaml
          # kind's kubelets serve self-signed certificates
          kubectl -n kube-system patch deployment metrics-server --type json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s
      - name: the chart in the cluster
        run: IMAGE=microsoft-365-mcp:e2e scripts/chart-e2e.sh
      - name: what the cluster saw
        if: failure()
        run: |
          kubectl -n m365-e2e get pods -o wide || true
          kubectl -n m365-e2e describe pods | tail -80 || true
          kubectl -n m365-e2e logs -l app.kubernetes.io/instance=e2e --all-containers --tail=60 || true
          kubectl -n m365-e2e logs valkey-sentinel-0 --tail=40 || true
