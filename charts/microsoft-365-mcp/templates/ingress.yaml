{{- if .Values.ingress.enabled }}
{{- if not (hasPrefix "https://" .Values.linksBaseUrl) }}{{- fail "ingress.enabled publishes the links port: linksBaseUrl must be its https address" -}}{{- end }}
{{- $host := .Values.linksBaseUrl | trimPrefix "https://" | regexFind "^[^/:]+" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "m365.fullname" . }}-links
  labels: {{- include "m365.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        # The two routes of the links port and nothing else: never the MCP port, the probes or the metrics.
        paths:
          - path: /d/
            pathType: Prefix
            backend:
              service:
                name: {{ include "m365.fullname" . }}
                port:
                  name: links
          - path: /u/
            pathType: Prefix
            backend:
              service:
                name: {{ include "m365.fullname" . }}
                port:
                  name: links
{{- end }}
